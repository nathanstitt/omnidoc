name: Release

# Publishing a GitHub Release from a pushed version tag. goreleaser cross-compiles
# the omnidoc CLI for every target (see .goreleaser.yaml) and uploads the
# archives + checksums. The workflow must already exist on the default branch for
# a tag push to trigger it, so this lands (and merges) before the first tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    # Bounded for the same reason as CI's jobs: without it a stuck runner
    # inherits GitHub's 6-hour default, and here that would leave a tag's
    # release hanging rather than failing where someone would notice.
    # goreleaser cross-compiles several targets, so this is roomier than CI's.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's changelog needs the full history and all tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Track the latest 1.26 patch, as ci.yml does: setup-go treats go.mod's
          # `go` directive as an exact pin, and a release built on 1.26.0 would
          # ship every stdlib vulnerability the later patches fixed.
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
